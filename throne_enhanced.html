<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🏆 AI 王座争夺战 - 完整版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #f39c12, #e74c3c, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #8e8e8e;
            font-size: 1rem;
        }
        
        .throne-container {
            position: relative;
            width: 400px;
            height: 300px;
            margin: 20px 0;
        }
        
        .throne {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #f39c12, #e67e22);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(243, 156, 18, 0.6);
            transition: all 0.5s ease;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 60px rgba(243, 156, 18, 0.6); }
            50% { box-shadow: 0 0 80px rgba(243, 156, 18, 0.8); }
        }
        
        .throne::before {
            content: '👑';
            font-size: 4rem;
            position: absolute;
            top: -40px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        .model-name {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .company-name {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .model-date {
            font-size: 1rem;
            opacity: 0.7;
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
        }
        
        .counter {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 25px;
        }
        
        .timeline {
            display: flex;
            gap: 5px;
            margin-top: 30px;
        }
        
        .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
        }
        
        .timeline-dot.active {
            background: #f39c12;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.8);
            transform: scale(1.5);
        }
        
        .stats {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            background: rgba(0,0,0,0.5);
            padding: 15px 30px;
            border-radius: 25px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f39c12;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #8e8e8e;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(243, 156, 18, 0.6);
            border-radius: 50%;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="header">
        <h1>🏆 AI 王座争夺战</h1>
        <p class="subtitle">大模型争霸史 · 2023-2026</p>
    </div>
    
    <div class="counter" id="counter">1 / 17</div>
    
    <div class="throne-container">
        <div class="throne" id="throne">
            <div class="model-name" id="model">GPT-4</div>
            <div class="company-name" id="company">OpenAI</div>
            <div class="model-date" id="date">2023-03-14</div>
        </div>
    </div>
    
    <div class="timeline" id="timeline"></div>
    
    <div class="stats">
        <div class="stat">
            <div class="stat-value">675</div>
            <div class="stat-label">总模型数</div>
        </div>
        <div class="stat">
            <div class="stat-value">50+</div>
            <div class="stat-label">参与公司</div>
        </div>
        <div class="stat">
            <div class="stat-value">4</div>
            <div class="stat-label">争霸年数</div>
        </div>
    </div>
    
    <script>
        const models = [
            { name: "GPT-4", org: "OpenAI", date: "2023-03-14", color: "#2ecc71" },
            { name: "GPT-4V", org: "OpenAI", date: "2023-11-06", color: "#2ecc71" },
            { name: "Grok-1", org: "xAI", date: "2024-03-17", color: "#e74c3c" },
            { name: "GPT-4o", org: "OpenAI", date: "2024-05-13", color: "#2ecc71" },
            { name: "Llama 3.1", org: "Meta", date: "2024-07-23", color: "#3498db" },
            { name: "Grok 3", org: "xAI", date: "2025-02-18", color: "#e74c3c" },
            { name: "Claude 3.7", org: "Anthropic", date: "2025-02-24", color: "#9b59b6" },
            { name: "DeepSeek V3.1", org: "DeepSeek", date: "2025-05-28", color: "#f39c12" },
            { name: "Claude 4 Opus", org: "Anthropic", date: "2025-07-22", color: "#9b59b6" },
            { name: "Llama 4", org: "Meta", date: "2025-07-23", color: "#3498db" },
            { name: "Claude 4.5", org: "Anthropic", date: "2025-08-21", color: "#9b59b6" },
            { name: "DeepSeek V3.2", org: "DeepSeek", date: "2025-11-20", color: "#f39c12" },
            { name: "GPT-5.1", org: "OpenAI", date: "2026-02-01", color: "#2ecc71" },
            { name: "DeepSeek V4", org: "DeepSeek", date: "2026-03-24", color: "#f39c12" },
            { name: "GPT-6", org: "OpenAI", date: "2026-04-14", color: "#2ecc71" },
            { name: "GPT-5.5", org: "OpenAI", date: "2026-04-23", color: "#2ecc71" },
            { name: "Claude Opus 4.8", org: "Anthropic", date: "2026-05-29", color: "#9b59b6" }
        ];
        
        let current = 0;
        
        // 初始化时间轴
        const timeline = document.getElementById('timeline');
        models.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'timeline-dot';
            timeline.appendChild(dot);
        });
        
        // 创建粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (3 + Math.random() * 4) + 's';
                particle.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(particle);
            }
        }
        
        function update() {
            const m = models[current];
            
            // 更新王座
            document.getElementById('model').textContent = m.name;
            document.getElementById('company').textContent = m.org;
            document.getElementById('date').textContent = m.date;
            document.getElementById('throne').style.background = 
                `linear-gradient(180deg, ${m.color}, ${m.color}88)`;
            document.getElementById('throne').style.boxShadow = 
                `0 0 60px ${m.color}80`;
            
            // 更新计数器
            document.getElementById('counter').textContent = 
                `${current + 1} / ${models.length}`;
            
            // 更新时间轴
            const dots = document.querySelectorAll('.timeline-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === current);
            });
            
            current = (current + 1) % models.length;
        }
        
        // 初始化
        createParticles();
        update();
        setInterval(update, 2000);
    </script>
</body>
</html>
