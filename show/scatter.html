<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligence vs Cost 性价比散点图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f1419; color: #e7e9ea; padding: 20px;
}
h1 { text-align: center; margin-bottom: 10px; font-size: 1.4em; }
.subtitle { text-align: center; color: #71767b; margin-bottom: 20px; font-size: 0.9em; }
.chart-container { 
  position: relative; width: 100%; max-width: 1100px; margin: 0 auto;
  background: #16181c; border-radius: 12px; padding: 20px;
}
.scatter-chart { position: relative; width: 100%; height: 600px; }
.axis-label {
  position: absolute; color: #71767b; font-size: 12px; font-weight: 500;
}
.x-label { bottom: -35px; left: 50%; transform: translateX(-50%); }
.y-label { left: -45px; top: 50%; transform: translateY(-50%) rotate(-90deg); white-space: nowrap; }
.tick-label { color: #71767b; font-size: 11px; }
.plot-area { position: absolute; top: 40px; left: 70px; right: 30px; bottom: 50px; }
.grid-line { position: absolute; background: #2f3336; }
.grid-h { left: 0; right: 0; height: 1px; }
.grid-v { top: 0; bottom: 0; width: 1px; }
.dot {
  position: absolute; border-radius: 50%; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s; transform: translate(-50%, -50%);
}
.dot:hover { transform: translate(-50%, -50%) scale(1.4); box-shadow: 0 0 12px rgba(255,255,255,0.4); z-index: 10; }
.tooltip {
  position: fixed; background: #212327; border: 1px solid #3f4347; border-radius: 8px;
  padding: 10px 14px; font-size: 13px; pointer-events: none; opacity: 0;
  transition: opacity 0.15s; z-index: 100; max-width: 280px;
}
.tooltip.visible { opacity: 1; }
.tooltip-name { font-weight: 600; margin-bottom: 4px; color: #fff; }
.tooltip-prov { color: #71767b; font-size: 11px; margin-bottom: 6px; }
.tooltip-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 2px; }
.tooltip-label { color: #71767b; }
.tooltip-val { color: #e7e9ea; font-weight: 500; }
.legend {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
  margin-top: 15px; padding-top: 15px; border-top: 1px solid #2f3336;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #71767b; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
<h1>🤖 Intelligence vs Cost 性价比散点图</h1>
<p class="subtitle">X轴: 价格 ($/1M tokens) | Y轴: 智能指数 (aaIntelligenceIndex) | 气泡越大智能越高</p>

<div class="chart-container">
  <div class="scatter-chart" id="chart">
    <div class="plot-area" id="plotArea">
      <!-- Grid and dots rendered by JS -->
    </div>
    <div class="axis-label x-label">Price ($/1M tokens, log scale)</div>
    <div class="axis-label y-label">Intelligence Index</div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="ttName"></div>
  <div class="tooltip-prov" id="ttProv"></div>
  <div class="tooltip-row"><span class="tooltip-label">智能指数:</span><span class="tooltip-val" id="ttInt"></span></div>
  <div class="tooltip-row"><span class="tooltip-label">价格:</span><span class="tooltip-val" id="ttCost"></span></div>
  <div class="tooltip-row"><span class="tooltip-label">性价比:</span><span class="tooltip-val" id="ttRatio"></span></div>
</div>

<script>
(async () => {
  const resp = await fetch('/projects/llm-timeline/aa-models-api.json');
  const models = await resp.json();

  // Provider colors
  const provColors = {
    'OpenAI':'#10a37f','Anthropic':'#d4a574','Google':'#4285f4','Meta':'#0866ff',
    'Mistral':'#eb6229','DeepSeek':'#676a6c','Alibaba':'#ff6a00','Microsoft':'#00a4ef',
    'xAI':'#ed9b2f','Kimi':'#8b5cf6','Tencent':'#07c160','Upstage':'#00c7b1',
    'Xiaomi':'#ff5722','Z AI':'#9c27b0','LG AI Research':'#00bcd4','China Mobile':'#e91e63',
    'InclusionAI':'#795548','default':'#71767b'
  };

  // Filter: has aaIntelligenceIndex and price > 0
  const data = models.filter(m => m.aaIntelligenceIndex > 0 && m.price1mBlended3to1 > 0).map(m => ({
    name: m.name,
    provider: m.provider,
    providerSlug: m.providerSlug,
    int: m.aaIntelligenceIndex,
    cost: m.price1mBlended3to1,
    ratio: m.aaIntelligenceIndex / m.price1mBlended3to1
  }));

  // Sort by ratio for tooltip ordering
  data.sort((a,b) => b.ratio - a.ratio);

  const plotArea = document.getElementById('plotArea');
  const tooltip = document.getElementById('tooltip');

  // Scales (log for cost)
  const intMin = 0, intMax = 65;
  const costMin = 0.05, costMax = 80;

  const W = plotArea.clientWidth;
  const H = plotArea.clientHeight;

  // Draw grid
  const intTicks = [0,10,20,30,40,50,60];
  const costTicks = [0.1,0.5,1,5,10,30,60];

  intTicks.forEach(v => {
    const y = H - (v - intMin) / (intMax - intMin) * H;
    const gl = document.createElement('div');
    gl.className = 'grid-line grid-h';
    gl.style.top = y + 'px';
    plotArea.appendChild(gl);
    const lbl = document.createElement('span');
    lbl.className = 'tick-label';
    lbl.style.cssText = `position:absolute;right:100%;margin-right:5px;top:${y}px;transform:translateY(-50%)`;
    lbl.textContent = v;
    plotArea.appendChild(lbl);
  });

  costTicks.forEach(v => {
    const x = Math.log(v / costMin) / Math.log(costMax / costMin) * W;
    const gl = document.createElement('div');
    gl.className = 'grid-line grid-v';
    gl.style.left = x + 'px';
    plotArea.appendChild(gl);
    const lbl = document.createElement('span');
    lbl.className = 'tick-label';
    lbl.style.cssText = `position:absolute;bottom:100%;margin-bottom:3px;left:${x}px;transform:translateX(-50%)`;
    lbl.textContent = '$' + v;
    plotArea.appendChild(lbl);
  });

  // Draw dots
  data.forEach((d,i) => {
    const x = Math.log(d.cost / costMin) / Math.log(costMax / costMin) * W;
    const y = H - (d.int - intMin) / (intMax - intMin) * H;
    const size = Math.max(6, Math.min(22, d.int / 3.5));
    const color = provColors[d.providerSlug] || provColors['default'];

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color};opacity:0.85`;

    dot.addEventListener('mouseenter', e => {
      document.getElementById('ttName').textContent = d.name;
      document.getElementById('ttProv').textContent = d.provider;
      document.getElementById('ttInt').textContent = d.int.toFixed(1);
      document.getElementById('ttCost').textContent = '$' + d.cost.toFixed(3) + '/1M';
      document.getElementById('ttRatio').textContent = d.ratio.toFixed(1) + ' (智能/美元)';
      tooltip.classList.add('visible');
    });
    dot.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    });
    dot.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));

    plotArea.appendChild(dot);
  });

  // Legend
  const usedProvs = [...new Set(data.map(d => d.providerSlug))];
  const legend = document.getElementById('legend');
  usedProvs.forEach(slug => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${provColors[slug]||provColors.default}"></span>${provColors[slug] ? slug : slug}`;
    legend.appendChild(item);
  });

  // Update legend labels to full provider names
  const slugToName = {};
  models.forEach(m => { slugToName[m.providerSlug] = m.provider; });
  legend.querySelectorAll('.legend-item').forEach(item => {
    const slug = item.textContent.trim();
    if (slugToName[slug]) item.lastChild.textContent = slugToName[slug];
  });
})();
</script>
</body>
</html>
