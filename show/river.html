<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 AI 河流图 - 模型洪流</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0c1445, #1a237e, #283593);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #42a5f5, #26c6da, #66bb6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            color: #8e8e8e;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        #riverChart {
            width: 100%;
            height: 500px;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            min-width: 200px;
        }
        
        .tooltip-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #42a5f5;
        }
        
        .tooltip-content {
            font-size: 0.9rem;
            color: #ccc;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        
        .legend-item:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .legend-item.inactive {
            opacity: 0.3;
        }
        
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #42a5f5;
        }
        
        .stat-label {
            color: #8e8e8e;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .insights {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
        }
        
        .insights h3 {
            margin-bottom: 15px;
            color: #42a5f5;
        }
        
        .insight-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            border-left: 3px solid #42a5f5;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.9rem;
        }
        
        .btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .btn.active {
            background: linear-gradient(135deg, #42a5f5, #26c6da);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 AI 河流图</h1>
        <p class="subtitle">时间流淌中的模型洪流 · 每条河流代表一个公司</p>
        
        <div class="controls">
            <button class="btn active" onclick="setView('stream')">流图模式</button>
            <button class="btn" onclick="setView('stacked')">堆叠模式</button>
            <button class="btn" onclick="setView('normalized')">归一化模式</button>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div class="legend" id="legend"></div>
        
        <div class="chart-container">
            <svg id="riverChart"></svg>
        </div>
        
        <div class="insights">
            <h3>🌊 河流洞察</h3>
            <div id="insightsContent"></div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip">
        <div class="tooltip-title" id="tooltipTitle"></div>
        <div class="tooltip-content" id="tooltipContent"></div>
    </div>

    <script>
        let data = [];
        let chart = null;
        let currentView = 'stream';
        
        // 公司颜色
        const companyColors = {
            "OpenAI": "#2ecc71",
            "Alibaba": "#e67e22",
            "Google": "#3498db",
            "Anthropic": "#9b59b6",
            "Meta": "#1abc9c",
            "DeepSeek": "#f39c12",
            "xAI": "#e74c3c",
            "Mistral": "#34495e",
            "NVIDIA": "#27ae60",
            "Baidu": "#2980b9",
            "ByteDance": "#8e44ad",
            "Tencent": "#16a085",
            "iFlytek": "#d35400",
            "Zhipu AI": "#c0392b",
            "MiniMax": "#7f8c8d",
            "Xiaomi": "#e74c3c"
        };
        
        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('../data/llm_timeline.json');
                data = await response.json();
                initChart();
                updateStats();
                updateInsights();
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }
        
        // 初始化图表
        function initChart() {
            const svg = d3.select('#riverChart');
            const width = svg.node().getBoundingClientRect().width;
            const height = 500;
            
            svg.attr('width', width).attr('height', height);
            
            // 处理数据
            const processedData = processData();
            
            // 创建流图
            const stack = d3.stack()
                .keys(Object.keys(companyColors))
                .offset(d3.stackOffsetWiggle)
                .order(d3.stackOrderInsideOut);
            
            const series = stack(processedData);
            
            const x = d3.scaleTime()
                .domain(d3.extent(processedData, d => d.date))
                .range([0, width]);
            
            const y = d3.scaleLinear()
                .domain([
                    d3.min(series, s => d3.min(s, d => d[0])),
                    d3.max(series, s => d3.max(s, d => d[1]))
                ])
                .range([height, 0]);
            
            const area = d3.area()
                .x(d => x(d.data.date))
                .y0(d => y(d[0]))
                .y1(d => y(d[1]))
                .curve(d3.curveBasis);
            
            // 绘制河流
            svg.selectAll('path')
                .data(series)
                .join('path')
                .attr('d', area)
                .attr('fill', d => companyColors[d.key] || '#95a5a6')
                .attr('opacity', 0.8)
                .attr('stroke', 'white')
                .attr('stroke-width', 0.5)
                .on('mouseover', showTooltip)
                .on('mousemove', moveTooltip)
                .on('mouseout', hideTooltip);
            
            // 添加X轴
            svg.append('g')
                .attr('transform', `translate(0, ${height})`)
                .call(d3.axisBottom(x).ticks(10).tickFormat(d3.timeFormat('%Y-%m')))
                .selectAll('text')
                .attr('fill', '#8e8e8e');
            
            // 初始化图例
            initLegend();
        }
        
        // 处理数据
        function processData() {
            // 按月统计各公司模型数量
            const monthly = {};
            
            data.forEach(item => {
                if (item.date && item.org) {
                    const month = item.date.substring(0, 7);
                    if (!monthly[month]) {
                        monthly[month] = { date: new Date(month + '-01') };
                    }
                    monthly[month][item.org] = (monthly[month][item.org] || 0) + 1;
                }
            });
            
            // 填充缺失值
            const companies = Object.keys(companyColors);
            Object.values(monthly).forEach(month => {
                companies.forEach(company => {
                    if (!month[company]) {
                        month[company] = 0;
                    }
                });
            });
            
            return Object.values(monthly).sort((a, b) => a.date - b.date);
        }
        
        // 显示提示框
        function showTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            const title = document.getElementById('tooltipTitle');
            const content = document.getElementById('tooltipContent');
            
            title.textContent = d.key;
            
            const total = d.reduce((sum, item) => sum + (item[1] - item[0]), 0);
            content.innerHTML = `
                <div>总模型数: ${Math.round(total)}</div>
                <div>占比: ${((total / data.length) * 100).toFixed(1)}%</div>
            `;
            
            tooltip.style.opacity = 1;
        }
        
        // 移动提示框
        function moveTooltip(event) {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = event.pageX + 10 + 'px';
            tooltip.style.top = event.pageY - 10 + 'px';
        }
        
        // 隐藏提示框
        function hideTooltip() {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.opacity = 0;
        }
        
        // 初始化图例
        function initLegend() {
            const legend = document.getElementById('legend');
            const companies = [...new Set(data.map(d => d.org).filter(Boolean))];
            
            legend.innerHTML = companies.map(company => `
                <div class="legend-item" onclick="toggleCompany('${company}')">
                    <div class="legend-dot" style="background: ${companyColors[company] || '#95a5a6'}"></div>
                    <span>${company}</span>
                </div>
            `).join('');
        }
        
        // 切换公司显示
        function toggleCompany(company) {
            // 这里可以添加过滤逻辑
        }
        
        // 更新统计
        function updateStats() {
            const stats = document.getElementById('stats');
            
            const companies = [...new Set(data.map(d => d.org).filter(Boolean))];
            const topCompanies = companies
                .map(c => ({
                    name: c,
                    count: data.filter(d => d.org === c).length
                }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 4);
            
            stats.innerHTML = topCompanies.map(company => `
                <div class="stat-card">
                    <div class="stat-value" style="color: ${companyColors[company.name] || '#42a5f5'}">${company.count}</div>
                    <div class="stat-label">${company.name}</div>
                </div>
            `).join('');
        }
        
        // 更新洞察
        function updateInsights() {
            const insightsContent = document.getElementById('insightsContent');
            
            const companies = [...new Set(data.map(d => d.org).filter(Boolean))];
            const topCompany = companies
                .map(c => ({
                    name: c,
                    count: data.filter(d => d.org === c).length
                }))
                .sort((a, b) => b.count - a.count)[0];
            
            const latestModel = data
                .filter(d => d.date)
                .sort((a, b) => new Date(b.date) - new Date(a.date))[0];
            
            insightsContent.innerHTML = `
                <div class="insight-item">
                    <strong>🌊 主流河流：</strong>${topCompany.name} 是最宽的河流，模型数量最多
                </div>
                <div class="insight-item">
                    <strong>📈 增长趋势：</strong>2025年后河流明显变宽，模型发布加速
                </div>
                <div class="insight-item">
                    <strong>🆕 最新汇入：</strong>${latestModel.name} (${latestModel.date}) - ${latestModel.org}
                </div>
                <div class="insight-item">
                    <strong>🌍 格局：</strong>中美两大河流占据主流，欧洲河流较细但稳定
                </div>
            `;
        }
        
        // 设置视图
        function setView(view) {
            currentView = view;
            
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 这里可以根据视图更新图表
        }
        
        // 初始化
        loadData();
    </script>
</body>
</html>
